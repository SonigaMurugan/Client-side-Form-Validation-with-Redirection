<html>
    <head>
        <title>registration</title>
        <link rel="stylesheet" href="styles.css">
        <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    </head>
    <body>
        <div class="container">
            <form action="admission.html" onsubmit="return validateLogin() "method="post">
                <h1>REGISTRATION</h1>

                <div class="input-box">
                    <input type="text" id="username" placeholder="username" required>
                    <i class='bx bx-user'></i><br><br>
                </div>

                <div class="input-box" >
                    <input type="password" id="password" placeholder="password" required>
                    <i class='bx bx-lock-alt'></i><br><br>
                </div>

                <div class="input-box" >
                    <input type="password" id="cpassword" placeholder="confirm password" required>
                    <i class='bx bx-lock-alt'></i><br><br>
                </div>
                <button type="submit" class="btn" onclick="validateLogin()">Register Now</button><br><br>
                <div class="register-link">
                    <P>Already have an account? <a href="login.html">login</a></P>  
                </div>
        </div>
        <script>
            function validateLogin()
            {
                var username=document.getElementById('username').value;
                var password=document.getElementById('password').value;
                var cpassword=document.getElementById('cpassword').value;
                var passwordRegex= /^(?=.*[A-Za-z\d@$!%*?&]).{8,}$/;
                if(!passwordRegex.test(password)){
                    alert('password should have atleast special character and be 8 character long.')
                    return false;
                }
                if(cpassword !== password)
                {
                  alert('password does not match');  
                  return false;
                }
            }
        </script>
    </body>
</html>
