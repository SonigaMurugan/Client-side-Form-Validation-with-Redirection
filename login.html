<html>
<head>
    <title>Login page</title>
    <link rel="stylesheet" href="styles.css">

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
    <boby>
        <div class="container">
            <form action="admission.html" onsubmit="return validateLogin() "method="post">
                <h1>LOGIN</h1>
                <div class="input-box">
                    <input type="text" id="username" name="username" placeholder="username" required>
                    <i class='bx bx-user'></i><br><br>
                </div>
                <div class="input-box">
                    <input type="password" id="password" name="password" placeholder="password" required>
                    <i class='bx bx-lock-alt'></i><br><br>
                </div>
                <button type="submit" class="btn" onclick="validateLogin()">Login</button><br><br>
                <div class="register-link">
                    <P>New to intern? <a href="signup.html">Sign up</a></P>  
                </div> 
            </form>
        </div>
        <script>
            function validateLogin()
            {
                var username=document.getElementById('username').value;
                var password=document.getElementById('password').value;
                var passwordRegex= /^(?=.*[A-Za-z\d@$!%*?&]).{8,}$/;
                if(passwordRegex.test(password)){
                    alert('Login successful!');
                }
                else{
                    alert('Ivalid password.password should contain atleast one character,one number,one special character');
                }
            }
        </script>
    </boby>
</html>
