                        const sum = subject6 + subject3Div2 + subject4Div2;

                        const courseSelect = document.getElementById("courseSelect").value;
            
                        
                        const totalMarks = sum;

                            resultElement.textContent = `Cutoff: ${totalMarks} \n`;
                        } else {
                            resultElement.textContent = `Invalid input. Total marks exceed 200.\n`;
                        }{
                            
const cutoff = 161;
    const totalMarks = 200;

   
    const probability = (cutoff / totalMarks) * 100;

    console.log(`The probability of a ${cutoff} cutoff out of ${totalMarks} is ${probability.toFixed(2)}%.`);

                        }



                        
                        resultElement.textContent += `Probability for ${collegeSelect} at ${courseSelect}: ${probability}%`;
